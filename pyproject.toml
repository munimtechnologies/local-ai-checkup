[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-checkup"
version = "0.4.2"
description = "Free read-only health and safety check for local AI setups (Ollama, LM Studio, llama.cpp, Open WebUI, ComfyUI, n8n, Dify, RAGFlow, AnythingLLM, Langflow, Flowise, LiteLLM, vLLM...). By MV2 of Munim, Inc., with AI agents."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "MV2 of Munim, Inc.", email = "munimversion2@gmail.com"}]
requires-python = ">=3.8"
keywords = ["ollama", "local-llm", "security", "open-webui", "comfyui", "n8n", "dify", "ragflow", "anythingllm", "langflow", "flowise", "litellm", "vllm", "self-hosted"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Security",
    "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/munimtechnologies/local-ai-checkup"
Website = "https://munimv2.github.io/"

[project.scripts]
local-ai-checkup = "local_ai_checkup:main"

[tool.setuptools]
py-modules = ["local_ai_checkup"]
